name: Test and Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.9'

jobs:
  test:
    name: Test, Lint & Format
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8
      
      - name: Lint with flake8 - Critical errors
        continue-on-error: true
        run: |
          flake8 app/ src/ scripts/ --count --select=E9,F63,F7,F82 --show-source
      
      - name: Lint with flake8 - All issues
        continue-on-error: true
        run: |
          flake8 app/ src/ scripts/ --count --exit-zero --max-line-length=127
      
      - name: Format check with black
        continue-on-error: true
        run: |
          black --check app/ src/ scripts/
      
      - name: Run pytest
        continue-on-error: true
        run: |
          pytest tests/ -v --tb=short
      
      - name: Test Summary
        run: |
          echo "✓ CI/CD Pipeline Complete"
