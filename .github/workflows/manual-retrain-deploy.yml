name: Manual Retrain & Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      retrain_model:
        description: 'Retrain model before deployment?'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: student-mlops-app
  PYTHON_VERSION: '3.9'

jobs:
  retrain:
    name: Retrain Model
    runs-on: ubuntu-latest
    if: ${{ inputs.retrain_model }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Download raw data from S3
        run: |
          python scripts/download_raw_data.py
      
      - name: Run DVC pipeline
        run: |
          dvc repro
      
      - name: Upload model to S3
        run: |
          python scripts/upload_processed_data.py
          python scripts/upload_all.py
      
      - name: Create model artifact
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: models/
          retention-days: 30

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ retrain ]
    if: |
      always() && 
      (needs.retrain.result == 'success' || 
       (needs.retrain.result == 'skipped' && !inputs.retrain_model))
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.environment }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.environment }}-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment }}
      url: https://api.${{ inputs.environment }}.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Deploy to ${{ inputs.environment }}
        run: |
          echo "Deploying to ${{ inputs.environment }} environment..."
          
          # Option 1: For EC2 deployment
          if [ "${{ inputs.environment }}" = "production" ]; then
            # SSH to production server
            # ssh -i ${{ secrets.EC2_KEY }} ec2-user@${{ secrets.EC2_HOST_PROD }} \
            #   "docker pull ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:production && \
            #    docker stop mlops-app && \
            #    docker run -d --name mlops-app -p 8000:8000 \
            #    -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            #    -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            #    ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:production"
            echo "Deploying to production..."
          else
            # SSH to staging server
            # ssh -i ${{ secrets.EC2_KEY }} ec2-user@${{ secrets.EC2_HOST_STAGING }} \
            #   "docker pull ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:staging && \
            #    docker stop mlops-app && \
            #    docker run -d --name mlops-app -p 8000:8000 \
            #    -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            #    -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            #    ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:staging"
            echo "Deploying to staging..."
          fi
      
      - name: Health check
        run: |
          echo "Checking API health..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "✓ API is healthy on ${{ inputs.environment }}"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 10
          done
          echo "⚠ Health check timed out"
          exit 1
        continue-on-error: true
      
      - name: Run smoke tests
        run: |
          python -m pip install requests
          python test_api.py
        continue-on-error: true

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [ retrain, build, deploy ]
    if: always()
    
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Student MLOps Manual Deployment - ${{ inputs.environment }}",
              "blocks": [
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n${{ inputs.environment }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Retrain:*\n${{ inputs.retrain_model }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Retrain Status:*\n${{ needs.retrain.result || 'skipped' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deploy Status:*\n${{ needs.deploy.result }}"
                    }
                  ]
                }
              ]
            }
        continue-on-error: true
